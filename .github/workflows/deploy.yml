name: MLOps Docker Hub to EC2 Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_IMAGE: rajputr274/mlops-app

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build-image.outputs.image_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $DOCKER_IMAGE:$IMAGE_TAG -t $DOCKER_IMAGE:latest .
          docker push $DOCKER_IMAGE:$IMAGE_TAG
          docker push $DOCKER_IMAGE:latest
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,DOCKER_IMAGE
          script: |
            # 1. Pull the latest built image tag
            docker pull $DOCKER_IMAGE:$IMAGE_TAG

            # 2. Stop & Remove existing container gracefully if running
            docker stop mlops-container || true
            docker rm mlops-container || true

            # 3. Run new container (mapping port 8000)
            docker run -d -p 8000:8000 --name mlops-container $DOCKER_IMAGE:$IMAGE_TAG

            # 4. Clean up unused/dangling images to save disk space on EC2
            docker image prune -f